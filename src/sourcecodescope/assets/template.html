<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%%SCS_TITLE%% - SourceCodeScope</title>
<style>%%SCS_CSS%%</style>
</head>
<body>
<header id="bar">
  <div class="brand"><span class="logo"></span><strong id="title">%%SCS_TITLE%%</strong><span id="summary"></span></div>
  <div class="tools">
    <div class="seg" id="mode" role="group" aria-label="表示モード">
      <button data-mode="explainer" title="値も描くリッチ表示">Explainer</button>
      <button data-mode="flow" title="構造と形状のみ">Flow</button>
    </div>
    <div class="seg" role="group" aria-label="展開の深さ">
      <button id="shallower" title="1段たたむ">−</button>
      <span id="depth" title="展開の深さ"></span>
      <button id="deeper" title="1段ひらく">＋</button>
    </div>
    <button id="play" title="流れのアニメーション"></button>
    <button id="fit" title="全体を表示">全体表示</button>
    <button id="theme" title="ライト / ダーク切り替え">テーマ</button>
    <button id="save" class="primary" title="現在の表示をSVGで保存">SVG保存</button>
  </div>
</header>
<main>
  <div id="stage">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="legend"></div>
    <div id="hint">クリック: 選択 / ブロックの展開・折りたたみ　ドラッグ: 移動　ホイール: 拡大縮小</div>
  </div>
  <aside id="panel"><div id="detail"></div></aside>
</main>
<script type="application/json" id="scs-data">%%SCS_DATA%%</script>
<script type="application/json" id="scs-config">%%SCS_CONFIG%%</script>
<script>%%SCS_D3%%</script>
<script>%%SCS_ELK%%</script>
<script>%%SCS_APP%%</script>
</body>
</html>
